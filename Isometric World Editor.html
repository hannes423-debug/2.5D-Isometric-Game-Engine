<script>

BA.forEach(a=>W.assets.set(a[0],{id:a[0],name:a[1],k:a[2],fw:a[3],fd:a[4],h:a[5],c:a[6],col:a[7],flags:a[8],cat:'object',ax:.5,ay:1}));

function rotC(dx,dy,r,w,d){return[[dx,dy],[d-1-dy,dx],[w-1-dx,d-1-dy],[dy,w-1-dx]][r%4]}

function mkObj(o){const a=AS(o.a),[w,d]=fp(o),g=new T.Group(),M=c=>new T.MeshLambertMaterial({color:c}),add=(geo,c,x,y,z)=>{const m=new T.Mesh(geo,M(c));m.position.set(x,y,z);g.add(m);return m};
if(a.src){let t=tex[a.id];if(!t){t=tex[a.id]=TL.load(a.src,()=>dirty=1)}const pw=a.sc||2,ph=pw*(a.ih||1)/(a.iw||1),m=new T.Mesh(new T.PlaneGeometry(pw,ph).translate((.5-a.ax)*pw,(.5-a.ay)*ph,0),new T.MeshBasicMaterial({map:t,transparent:true,alphaTest:.05,side:T.DoubleSide}));m.rotation.y=Math.PI/4;m.position.set(w/2,0,d/2);g.add(m)}
else if(a.k=='house'){add(BX.clone().scale(w*.9,a.h*.55,d*.9),0xe3d3b0,w/2,a.h*.275,d/2);const r=add(new T.ConeGeometry(Math.max(w,d)*.75,a.h*.45,4),a.c,w/2,a.h*.55+a.h*.225,d/2);r.rotation.y=Math.PI/4}
else if(a.k=='tree'){add(new T.CylinderGeometry(.18,.25,a.h*.5,8),0x6b4a2a,w/2,a.h*.25,d/2);add(new T.SphereGeometry(Math.min(w,d)*.65,10,8),a.c,w/2,a.h*.65,d/2)}

else add(BX.clone().scale(w*.92,a.h*.96,d*.92),a.c,w/2,a.h/2,d/2);
g.position.set(o.x,o.z,o.y);g.traverse(m=>m.userData.oid=o.id);return g}
function vox(x,y,z,s,wire){const m=new T.Mesh(BX,new T.MeshBasicMaterial({color:SC[s]||0xffffff,transparent:true,opacity:wire?.07:.38,depthWrite:false}));m.scale.setScalar(.94);m.position.set(x+.5,z+.5,y+.5);gC.add(m);const e=new T.LineSegments(new T.EdgesGeometry(BX),new T.LineBasicMaterial({color:wire?0x777766:SC[s]}));e.scale.setScalar(.94);e.position.copy(m.position);gC.add(e)}
function rebuild(){clr(gT);clr(gO);clr(gC);const by={};for(const[k,v]of W.tiles){(by[v.t]=by[v.t]||[]).push([k,v])}

for(const o of W.objs.values())if(AS(o.a))gO.add(mkObj(o));
const so=W.objs.get(S.sel);
if(S.col){for(const o of W.objs.values())if(AS(o.a)&&o!==so)cells(o).forEach(c=>c[3]&&vox(c[0],c[1],c[2],c[3]));for(const[k,s]of W.ovr){const[x,y,z]=k.split(',').map(Number);vox(x,y,z,s||1,!s)}}
if(so&&S.tool=='col'){const a=AS(so.a),c=so.col||a.col;for(let x=0;x<a.fw;x++)for(let y=0;y<a.fd;y++)for(let z=0;z<a.h;z++){const s=c[K(x,y,z)]||0,[wx,wy]=rotC(x,y,so.r,a.fw,a.fd);vox(so.x+wx,so.y+wy,so.z+z,s,!s)}}
dirty=0;valid();ui2()}
// ---- picking and tools
const ray=new T.Raycaster(),mv=new T.Vector2(),pl=new T.Plane(new T.Vector3(0,1,0),0),hp=new T.Vector3();let cur=null,drag=0,last=null,rect0=null,pan=null;
function hover(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);pl.constant=-(S.Z+1);if(!ray.ray.intersectPlane(pl,hp))return null;const x=Math.floor(hp.x),y=Math.floor(hp.z);return x<0||y<0||x>=N||y>=N?null:[x,y]}
function line(a,b,f){let[x,y]=a;const dx=Math.abs(b[0]-x),dy=-Math.abs(b[1]-y),sx=x<b[0]?1:-1,sy=y<b[1]?1:-1;let e=dx+dy;for(;;){f(x,y);if(x==b[0]&&y==b[1])break;const e2=2*e;if(e2>=dy){e+=dy;x+=sx}if(e2<=dx){e+=dx;y+=sy}}}
function stamp(x,y,erase){const s=S.brush,o=-(s>>1);for(let i=0;i<s;i++)for(let j=0;j<s;j++){const cx=x+o+i,cy=y+o+j;if(cx<0||cy<0||cx>=N||cy>=N)continue;put('tiles',K(cx,cy,S.Z),erase?undefined:{t:S.tile,v:Math.floor(hs(cx,cy,S.Z)*9)})}}
function colAt(c){const so=W.objs.get(S.sel);if(so&&AS(so.a)){const a=AS(so.a),[w,d]=[a.fw,a.fd],r=so.r,wx=c[0]-so.x,wy=c[1]-so.y,z=S.Z-so.z;let l;if(r==0)l=[wx,wy];else if(r==1)l=[wy,d-1-wx];else if(r==2)l=[w-1-wx,d-1-wy];else l=[wx==wx?w-1-wy:0,wx];if(r==3)l=[w-1-wy,wx];if(l[0]<0||l[1]<0||l[0]>=w||l[1]>=d||z<0||z>=a.h)return;const col={...(so.col||a.col)},k=K(l[0],l[1],z);S.cs?col[k]=S.cs:delete col[k];put('objs',so.id,{...so,col})}else put('ovr',K(c[0],c[1],S.Z),S.cs==0?undefined:S.cs)}
const pick=e=>{const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(gO.children,true)[0];return h?h.object.userData.oid:null};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);if(e.button!=0||S.tool=='pan'){pan=[e.clientX,e.clientY];return}const c=hover(e);
if(S.tool=='select'){S.sel=pick(e);ui();dirty=1;return}if(!c)return;const t=S.tool;
if(t=='paint'||t=='erase'){begin();drag=1;stamp(c[0],c[1],t=='erase');last=c}
else if(t=='rect'||t=='rerase'){rect0=c;drag=1}
else if(t=='col'){begin();drag=1;colAt(c);last=c}
else if(t=='eye'){const v=W.tiles.get(K(c[0],c[1],S.Z));if(v){S.tile=v.t;S.tab='t';S.tool='paint';ui()}}
else if(t=='obj'){const o={id:'o'+(++S.n),a:S.asset,x:c[0],y:c[1],z:S.Z,r:S.rot};if(!inB(o)||ovl(o))return log('Invalid placement');begin();put('objs',o.id,o);end();S.sel=o.id;ui()}};
cv.onpointermove=e=>{if(pan){const ppu=cv.clientHeight/(zoom*2);tg.addScaledVector(new T.Vector3(.707,0,-.707),-(e.clientX-pan[0])/ppu).addScaledVector(new T.Vector3(-.707,0,-.707),(e.clientY-pan[1])/ppu/.5);pan=[e.clientX,e.clientY];return}

// ---- preview

function focus(o){if(o){tg.set(o.x,o.z,o.y);S.Z=Math.min(ZM-1,o.z);S.sel=o.id;ui();dirty=1}}
const TOOLS=[['select','Select (V)'],['paint','Paint (B)'],['rect','Rect fill (G)'],['rerase','Rect erase (X)'],['erase','Erase tiles (E)'],['obj','Place object (O)'],['col','Collision paint (C)'],['eye','Eyedropper (I)'],['pan','Pan (H / middle-drag)']];
function ui(){$('tb').innerHTML=`<button onclick="newP()">New</button><button onclick="fj.click()">Open</button><button onclick="dl(ser(0),'world.json')">Save</button><button onclick="undo()">↶ Undo</button><button onclick="redoF()">↷ Redo</button><button onclick="dl(ser(1),'world_export.json')">Export</button>|`+TOOLS.map(t=>`<button class="${S.tool==t[0]?'on':''}" title="${t[1]}" onclick="S.tool='${t[0]}';ui();dirty=1">${t[1]}</button>`).join('')+`|Brush<input type=number min=1 max=8 value=${S.brush} onchange="S.brush=+this.value"> Rot ${S.rot*90}° <select onchange="S.cs=+this.value">${ST.map((s,i)=>`<option value=${i} ${S.cs==i?'selected':''}>${s}</option>`).join('')}</select><label><input type=checkbox ${S.grid?'checked':''} onchange="S.grid=+this.checked"> Grid</label><label><input type=checkbox ${S.col?'checked':''} onchange="S.col=+this.checked;dirty=1"> Collision</label><label><input type=checkbox ${S.rev?'checked':''} onchange="S.rev=+this.checked"> Reverse wheel</label>`;
const L=S.tab=='t'?Object.entries(TILES).map(([id,v])=>[id,v[0],'background:#'+v[1][0].toString(16).padStart(6,'0')]):[...W.assets.values()].map(a=>[a.id,a.name,a.src?`background-image:url(${a.src})`:'background:#'+a.c.toString(16).padStart(6,'0')]);
$('lf').innerHTML=`<button class="${S.tab=='t'?'on':''}" onclick="S.tab='t';ui()">Terrain</button><button class="${S.tab=='o'?'on':''}" onclick="S.tab='o';ui()">Objects</button><input placeholder="Search" value="${S.q}" oninput="S.q=this.value;ui()" style="width:100%;margin:4px 0"><button onclick="fi.click()" style="width:100%">Import images…</button>`+L.filter(i=>i[1].toLowerCase().includes(S.q.toLowerCase())).map(i=>`<div class="it ${(S.tab=='t'?S.tile:S.asset)==i[0]?'on':''}" onclick="${S.tab=='t'?`S.tile='${i[0]}';S.tool='paint'`:`S.asset='${i[0]}';S.tool='obj'`};ui()"><div class="sw" style="${i[2]}"></div>${i[1]}</div>`).join('');
const o=W.objs.get(S.sel),a=o&&AS(o.a),num=(l,f,v,fn)=>`<label>${l} <input type=number value="${v}" onchange="${fn}('${f}',this.value)"></label>`;
$('rt').innerHTML=o&&a?`<h4>${a.name} (${o.id})</h4><b>Transform</b>${num('X','x',o.x,'setO')}${num('Y','y',o.y,'setO')}${num('Z','z',o.z,'setO')}${num('Rot(0-3)','r',o.r,'setO')}<h4>Asset (all instances)</h4>${num('Footprint W','fw',a.fw,'setA')}${num('Footprint D','fd',a.fd,'setA')}${num('Height','h',a.h,'setA')}${a.src?num('Anchor X','ax',a.ax,'setA')+num('Anchor Y','ay',a.ay,'setA')+num('Scale','sc',a.sc||2,'setA'):''}<h4>Flags</h4>${['move','los','interact','phase'].map(f=>`<label><input type=checkbox ${a.flags[f]?'checked':''} onchange="setF('${f}',this.checked)"> ${({move:'Blocks movement',los:'Blocks line of sight',interact:'Interactable',phase:'Phase-through'})[f]}</label>`).join('')}<h4>Collision</h4><div>${o.col?'Instance override active':'Using asset defaults'}</div><button onclick="S.tool='col';ui();dirty=1">Edit voxels</button><button onclick="colAll(1)">Fill</button><button onclick="colAll(0)">Clear</button>${o.col?'<button onclick="begin();put(\'objs\',S.sel,{...W.objs.get(S.sel),col:undefined});end();dirty=1">Reset</button>':''}<h4>Actions</h4><button onclick="dup()">Duplicate</button><button onclick="key_del()">Delete</button>`:`<h4>Inspector</h4>Select an object (V) to edit transform, footprint, flags and voxel collision. With no object selected, the Collision tool paints world-level overrides.`;ui2()}
function ui2(){$('hud').textContent=`ACTIVE LEVEL: Z ${S.Z}`;$('bt').innerHTML=`<div style="flex:1"><b>Validation (${VL.length})</b>${VL.map((v,i)=>`<div class="${v[0]}" onclick="focus(VL[${i}][2])">${v[0]=='e'?'✖':'⚠'} ${v[1]}</div>`).join('')||'<div>No issues.</div>'}</div><div>Tiles ${W.tiles.size}<br>Objects ${W.objs.size}<br>Overrides ${W.ovr.size}<br>Undo ${hist.length}</div><div style="flex:1">${logs.join('<br>')}<br>Wheel: height · Ctrl+wheel: zoom · Middle/right drag: pan</div>`}
const setO=(f,v)=>{const o=W.objs.get(S.sel);begin();put('objs',o.id,{...o,[f]:+v});end()},setA=(f,v)=>{const a=AS(W.objs.get(S.sel).a);begin();put('assets',a.id,{...a,[f]:+v});end()},setF=(f,v)=>{const a=AS(W.objs.get(S.sel).a);begin();put('assets',a.id,{...a,flags:{...a.flags,[f]:+v}});end()};
function colAll(on){const o=W.objs.get(S.sel),a=AS(o.a),c=on?fill(a.fw,a.fd,a.h,S.cs||1):{};begin();put('objs',o.id,{...o,col:c});end();ui()}
function dup(){const o=W.objs.get(S.sel),n={...o,id:'o'+(++S.n),x:Math.min(N-1,o.x+1)};begin();put('objs',n.id,n);end();S.sel=n.id;ui()}
function key_del(){begin();put('objs',S.sel,undefined);end();S.sel=null;ui()}
// ---- persistence
function ser(nav){const w={format:'environmental-engine-world',version:1,conventions:'Cell [x,y,z]: x east, y south, z up; unit cube. Tile at z occupies layer z; its walking surface is elevation z+1. Object x,y = min corner of footprint; rot in 90deg steps rotates local voxels about footprint. Voxel states: '+ST.map((s,i)=>i+'='+s).join(', '),grid:{w:N,d:N,h:ZM,cellW:64,cellD:32,step:16},seed:S.seed,assets:Object.fromEntries(W.assets),tiles:[...W.tiles].map(([k,v])=>[...k.split(',').map(Number),v.t,v.v]),objects:[...W.objs.values()],collisionOverrides:[...W.ovr].map(([k,s])=>[...k.split(',').map(Number),s])};
if(nav){const cs=new Map();for(const o of W.objs.values())if(AS(o.a))cells(o).forEach(c=>c[3]&&cs.set(K(c[0],c[1],c[2]),c[3]));for(const[k,s]of W.ovr)s?cs.set(k,s):cs.delete(k);const fl=[],bl=[];for(const[k,v]of W.tiles){const[x,y,z]=k.split(',').map(Number);if(v.t!='water'&&!W.tiles.has(K(x,y,z+1)))fl.push([x,y,z+1])}
for(const[k,s]of cs){const c=k.split(',').map(Number);if(s==2)fl.push(c);else if([1,3,6].includes(s))bl.push([...c,s])}w.nav={floors:fl,blocked:bl,note:'floors: walkable surface cells [x,y,z] (z = standing elevation). blocked: [x,y,z,state]; states 1,3 block movement, 6 only for non-phasing; vision blockers = states 1,4.'}}return JSON.stringify(w)}
function dl(s,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=n;a.click();saved=true;log('Wrote '+n)}
function loadW(s){try{const w=JSON.parse(s);if(w.format!='environmental-engine-world'||!w.tiles||!w.objects)throw 0;W.tiles=new Map(w.tiles.map(a=>[K(a[0],a[1],a[2]),{t:a[3],v:a[4]}]));W.objs=new Map(w.objects.map(o=>[o.id,o]));W.ovr=new Map((w.collisionOverrides||[]).map(a=>[K(a[0],a[1],a[2]),a[3]]));for(const id in w.assets)W.assets.set(id,w.assets[id]);S.n=Math.max(0,...[...W.objs.keys()].map(k=>+k.slice(1)||0));hist.length=redo.length=0;S.sel=null;dirty=1;ui();return 1}catch(e){log('Could not read project file');return 0}}
function newP(){if(!saved&&!confirm('Discard unsaved changes?'))return;W.tiles.clear();W.objs.clear();W.ovr.clear();hist.length=0;redo.length=0;S.sel=null;dirty=1;ui()}
$('fj').onchange=e=>{const f=e.target.files[0];f&&f.text().then(loadW)};
$('fi').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const id='img_'+f.name.replace(/\W/g,'_')+Date.now()%1e5;W.assets.set(id,{id,name:f.name.replace(/\.\w+$/,''),k:'sprite',src:r.result,iw:im.width,ih:im.height,sc:2,fw:2,fd:2,h:2,c:0x999999,col:fill(2,2,2),flags:{move:1,los:0},cat:'object',ax:.5,ay:1});S.tab='o';S.asset=id;S.tool='obj';ui();log('Imported '+f.name)};im.src=r.result};r.readAsDataURL(f)})};
// ---- sample world
function sample(){const T_=(x,y,z,t)=>W.tiles.set(K(x,y,z),{t,v:Math.floor(hs(x,y,z)*9)}),O_=(a,x,y,z,r=0)=>{const id='o'+(++S.n);W.objs.set(id,{id,a,x,y,z,r})};
for(let x=0;x<N;x++)for(let y=0;y<N;y++){T_(x,y,0,x<4?'water':x==4?'sand':(x+y)%11==0?'dirt':'grass')}
for(let x=5;x<28;x++)for(let y=14;y<18;y++)T_(x,y,0,'cobble');for(let x=0;x<4;x++)for(let y=20;y<22;y++)T_(x,y,1,'wood');for(let x=4;x<6;x++)for(let y=20;y<22;y++)T_(x,y,0,'cobble');
for(let x=10;x<16;x++)for(let y=6;y<11;y++)T_(x,y,1,'stone');O_('stairs',9,7,1,0);for(let y=6;y<11;y++)O_('wall',16,y,1);
O_('house',18,5,1+0*0);W.objs.get('o'+S.n).z=0;O_('tree',22,20,0);O_('tree',7,24,0);for(let x=18;x<25;x++)O_('fence',x,12,0);O_('crate',12,19,0);O_('lamp',9,13,0);O_('lamp',26,13,0);
W.ovr.set(K(21,12,0),0);W.ovr.set(K(5,20,1),3)}
let loaded=0;try{loaded=localStorage.ee_world&&loadW(localStorage.ee_world)}catch(e){}if(!loaded){sample()}
setInterval(()=>{if(!saved)try{localStorage.ee_world=ser(0)}catch(e){}},1500);addEventListener('beforeunload',e=>{if(!saved)e.preventDefault()});
ui();(function loop(){try{view();if(dirty)rebuild();preview();R.render(sc,cam)}catch(e){console.error(e)}requestAnimationFrame(loop)})();
</script></body></html>
